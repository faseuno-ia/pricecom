# Railway — servicio "pricecom-worker" (poll loop + extracciones Playwright)
#
# Build via Dockerfile en lugar de Nixpacks para tener control explícito de
# la instalación de Chromium para Playwright (~500MB de deps de sistema).
#
# IMPORTANTE: el Root Directory del servicio en Railway debe estar vacío
# (la raíz del repo). El Dockerfile referencia paths desde la raíz del
# monorepo (COPY . . trae todo, incluyendo lib/, prisma/, worker/, etc.).

[build]
builder = "DOCKERFILE"
dockerfilePath = "worker/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
